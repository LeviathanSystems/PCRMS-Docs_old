name: Build and deploy

on:
  workflow_dispatch: # Allow manual triggers
  push:
    branches:
      - master
    paths:
      - 'content/**'
      - 'static/**'
      - 'layouts/**'
      - 'assets/**'
      - 'hugo.toml'
      - 'themes/**'

# These permissions are required for it to work
permissions:
  contents: read
  pages: write
  id-token: write

# Makes sure only one workflow runs at a time.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  buildAndDeploy:
    runs-on: ubuntu-latest
    # This environment is required!
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.pages_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Fetch Hugo themes as submodules
          fetch-depth: 0         # Fetch all history for .GitInfo and .Lastmod
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.2'
          extended: true  # Use extended version for SCSS/SASS support
      
      - name: Build Hugo Site
        run: hugo --minify
      
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/' # Hugo builds to public/ by default
      
      - name: Deploy to GitHub Pages
        id: deployment # This is required for environment
        uses: actions/deploy-pages@v4
